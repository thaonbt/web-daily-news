<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Bản tin hằng ngày</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
      --accent: #2563eb; --accent-bg: #dbeafe; --warn-bg: #fffbeb; --warn-border: #fbbf24; --warn-text: #92400e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
        --accent: #60a5fa; --accent-bg: #1e3a8a; --warn-bg: #3b2f0b; --warn-border: #b45309; --warn-text: #fde68a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.65;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 56rem; margin: 0 auto; padding: 1.5rem 16px 3rem; }
    header { text-align: center; margin-bottom: 1.25rem; }
    .badge { display: inline-block; background: var(--accent-bg); color: var(--accent); font-size: .7rem;
             font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: .2rem .7rem; border-radius: 999px; }
    #meta { color: var(--muted); font-size: .8rem; margin: .6rem 0 0; }
    #stats { color: var(--muted); font-size: .8rem; margin: .25rem 0 0; }
    #stats:empty { display: none; }

    #tabs { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1rem; }
    #tabs button { font: inherit; font-size: .85rem; cursor: pointer; padding: .4rem .9rem; border-radius: 999px;
                   border: 1px solid var(--border); background: var(--card); color: var(--text); }
    #tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

    #banner { display: none; background: var(--warn-bg); color: var(--warn-text);
              border-left: 4px solid var(--warn-border); border-radius: 0 .5rem .5rem 0;
              padding: .8rem 1rem; margin-bottom: 1rem; font-size: .9rem; }

    main { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; }
    main h1 { font-size: 1.6rem; color: var(--accent); text-align: center; margin: 0 0 1rem; }
    main h2 { font-size: 1.35rem; margin: 2rem 0 .75rem; padding-bottom: .4rem; border-bottom: 2px solid var(--border); }
    main h3 { font-size: 1.05rem; color: var(--accent); margin: 1.25rem 0 .5rem; }
    main ul { padding-left: 1.25rem; margin: 0 0 1rem; }
    main li { margin-bottom: .4rem; }
    main ul ul { margin: .3rem 0 .6rem; list-style: circle; }
    main a { color: var(--accent); text-underline-offset: 2px; }
    main hr { border: 0; border-top: 1px solid var(--border); margin: 1.75rem 0; }
    main pre { white-space: pre-wrap; word-break: break-word; }
    /* Tin đã có ở bản trước: chuyển sang màu muted (giữ độ tương phản đọc được) thay vì giảm opacity. */
    main li.seen, main li.seen > strong, main li.seen a { color: var(--muted); }
    main li.seen > strong { font-weight: 500; }
    .seen-badge { display: inline-block; margin-left: .5rem; padding: .05rem .5rem; border-radius: 999px;
                  background: var(--border); color: var(--muted); font-size: .7rem; font-weight: 600; vertical-align: middle; }
    footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 1.5rem; }
    @media (max-width: 480px) { main { padding: 1rem; } main h1 { font-size: 1.3rem; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge">AI Daily Newsletter</span>
      <p id="meta">Đang tải…</p>
      <p id="stats"></p>
    </header>

    <div id="banner" role="status"></div>
    <nav id="tabs" role="tablist" aria-label="Các bản tin"></nav>
    <main id="content" aria-live="polite"></main>

    <footer>Tổng hợp tự động bằng Python &amp; Gemini AI · Nội dung do AI tóm tắt, hãy kiểm tra lại qua link nguồn.</footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
