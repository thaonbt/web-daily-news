name: Update daily news

on:
  schedule:
    # GitHub Actions cron chạy theo UTC (có thể trễ vài phút đến vài chục phút khi tải cao).
    - cron: '17 22 * * *'   # 05:17 ICT (UTC+7) - Bản sáng
    - cron: '17 4 * * *'    # 11:17 ICT (UTC+7) - Bản trưa
  workflow_dispatch:         # chạy tay từ tab Actions
  # Cố ý KHÔNG có trigger `push`: mỗi lần push sẽ tốn quota Gemini free tier.

permissions:
  contents: write

# Không cho 2 lần chạy song song (tránh đua nhau ghi news.json / push).
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch RSS and summarize with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Tuỳ chọn: Settings > Variables > Actions > GEMINI_MODELS = "model-chinh,model-du-phong"
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python main.py

      # Lưu news.json về main để lần chạy sau còn lịch sử (bản cũ dùng làm fallback).
      # Chạy cả khi bước trên fail, vì lúc đó main.py đã ghi last_run=failed vào news.json.
      - name: Commit news.json
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "news.json không đổi"
          else
            git commit -m "chore(news): update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # Chỉ publish đúng 3 file cần thiết (không đẩy main.py, workflow... lên site).
      - name: Prepare site
        if: ${{ !cancelled() }}
        run: |
          mkdir site
          cp index.html app.js news.json site/

      - name: Deploy to GitHub Pages (gh-pages)
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
