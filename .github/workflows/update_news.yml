name: Update daily news

on:
  # Trigger chính: Cloudflare Worker (xem worker/index.js) gọi workflow_dispatch đúng giờ.
  workflow_dispatch:
    inputs:
      slot:
        description: 'Phiên: morning hoặc midday (để trống = tự suy ra theo giờ Việt Nam)'
        required: false
        default: ''
      force:
        description: "'true' = luôn tạo lại edition của phiên này; 'false' = bỏ qua nếu đã có"
        required: false
        default: 'true'

  # Lịch dự phòng của GitHub. Thường chạy trễ vài giờ, nhưng nếu Worker đã tạo edition của phiên đó
  # thì main.py tự bỏ qua (SKIP_IF_EXISTS), không tốn quota Gemini.
  schedule:
    - cron: '17 22 * * *'   # 05:17 ICT (UTC+7) - phiên sáng
    - cron: '17 4 * * *'    # 11:17 ICT (UTC+7) - phiên trưa

permissions:
  contents: write

# Không cho 2 lần chạy song song (tránh đua nhau ghi news.json / push).
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch RSS and summarize with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Tuỳ chọn: Settings > Variables > Actions > GEMINI_MODELS = "model-chinh,model-du-phong"
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          # Phiên lấy từ input (Worker/chạy tay) hoặc từ chính cron kích hoạt, nên không sai khi run bị trễ.
          SLOT: ${{ inputs.slot || (github.event.schedule == '17 22 * * *' && 'morning') || (github.event.schedule == '17 4 * * *' && 'midday') || '' }}
          # Lịch dự phòng và lần gọi của Worker (force=false) bỏ qua nếu phiên đã có; chạy tay mặc định tạo lại.
          SKIP_IF_EXISTS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force == 'false') }}
        run: python main.py

      # Lưu site/news.json về main. Cloudflare tự build và deploy khi có push lên main.
      # Chạy cả khi bước trên fail, vì lúc đó main.py đã ghi last_run=failed vào news.json.
      - name: Commit news.json
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/news.json
          if git diff --cached --quiet; then
            echo "news.json không đổi"
          else
            git commit -m "chore(news): update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
