name: Auto Update News and Deploy

on:
  push:
    branches: [ main ]
  schedule:
    # GitHub Actions chạy theo múi giờ UTC, 
    # nên giờ Việt Nam (UTC+7) sẽ được quy đổi sang giờ UTC
    # Lịch chạy mỗi ngày
    # 5:30 sáng VN = 22:30 UTC (của ngày hôm trước)
    # 12:30 trưa VN = 5:30 UTC (của ngày hôm đó)
    - cron: '30 22,5 * * *' 

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main.py to fetch and generate news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages